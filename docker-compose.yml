version: '3.8'

services:
  #mongo database
  mongodb:
    image: mongo:latest
    container_name: quizpulse-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - quizpulse-network

  #mongodb  UI
  mongo-express:
    image: mongo-express:latest
    container_name: quizpulse-mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_SERVER: mongodb
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - quizpulse-network

  #Auth Service
  auth-service:
    build: ./auth-service
    container_name: quizpulse-auth-service
    environment:
      - MONGO_URI=mongodb://admin:password@mongodb:27017/auth_db?authSource=admin
      - JWT_SECRET=zaid
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    networks:
      - quizpulse-network
    
  quiz-service:
    build: ./quiz-service
    container_name: quizpulse-quiz-service
    environment:
      - MONGO_URI=mongodb://admin:password@mongodb:27017/quiz_db?authSource=admin
      - JWT_SECRET=zaid
    ports:
      - "3002:3002"
    depends_on:
      - mongodb
    networks:
      - quizpulse-network

#Networks & Volumes
networks:
  quizpulse-network:
    driver: bridge

volumes:
  mongodb_data: